name: mobile-smoke

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-smoke.yml"
      - "Cargo.toml"
      - "crates/**"
      - "src-tauri/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-package:
    name: Android release APK (aarch64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify Android toolchain
        shell: bash
        run: |
          java -version
          javac -version
          test -d "$NDK_HOME"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Initialize Android project non-interactively
        run: cargo tauri android init --ci --skip-targets-install

      - name: Build Android release APK
        run: cargo tauri android build --ci --target aarch64 --apk

      - name: Verify Android package was produced
        shell: bash
        run: |
          find src-tauri/gen/android -type f -name "*.apk" -print -quit | grep -q .

  ios-simulator-package:
    name: iOS release simulator app (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with iOS simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          pod --version

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Initialize iOS project non-interactively
        run: cargo tauri ios init --ci --skip-targets-install

      - name: Build iOS release simulator app
        run: cargo tauri ios build --ci --target aarch64-sim

      - name: Verify iOS simulator app was produced
        run: |
          find src-tauri/gen/apple -type d -name "*.app" -print -quit | grep -q .
