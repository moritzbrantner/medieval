name: implement-tactical-forests

on:
  push:
    branches:
      - feature/tactical-forest-movement

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install Tauri Linux prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust with WebAssembly target
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Apply forest slice
        run: python3 .github/scripts/implement-tactical-forests.py
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Test web contracts
        run: node --test web-tests/*.test.mjs
      - name: Build tactical browser runtime
        run: cargo build --manifest-path web-battle-wasm/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Stage tactical browser runtime
        run: |
          mkdir -p web/pkg
          wasm-bindgen web-battle-wasm/target/wasm32-unknown-unknown/release/medieval_web_battle.wasm \
            --target web \
            --out-dir web/pkg \
            --out-name medieval_web_battle \
            --no-typescript
      - name: Install browser acceptance dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test tactical controls end to end
        run: npm run test:e2e:controls
      - name: Commit validated implementation
        run: |
          git config user.name "moritzbrantner"
          git config user.email "31051084+moritzbrantner@users.noreply.github.com"
          git rm .github/scripts/implement-tactical-forests.py .github/workflows/implement-tactical-forests.yml
          git add crates/medieval-core/src/terrain.rs \
            crates/medieval-core/src/lib.rs \
            crates/medieval-core/src/tactical.rs \
            crates/medieval-renderer/src/terrain.rs \
            crates/medieval-renderer/src/scene.rs \
            crates/medieval-renderer/src/gpu.rs \
            crates/medieval-renderer/src/battlefield.wgsl \
            web-battle-wasm/src/lib.rs \
            web-tests/browser-battle-contract.test.mjs \
            e2e/tactical-controls.spec.mjs \
            docs/ROADMAP.md \
            docs/BATTLE-ARCHITECTURE.md
          git commit -m "Add core-owned tactical forests"
          git push origin HEAD:feature/tactical-forest-movement
