name: platform-smoke

on:
  pull_request:
    paths:
      - ".github/workflows/platform-smoke.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "src-tauri/**"
      - "web/**"
      - "web-tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-shell:
    name: desktop-shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e

      - name: Compile native application shell in release mode
        run: cargo build --locked --package medieval --release

  browser-input-contract:
    name: desktop input contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify semantic controls and keyboard focus
        run: node --test web-tests/persistence-contract.test.mjs
