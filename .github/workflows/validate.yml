name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Tauri Linux prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check JavaScript syntax
        run: find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Test web contracts
        run: node --test web-tests/*.test.mjs

  asset-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/asset-tooling-consumer.yml
    secrets: inherit
    permissions:
      contents: read

  pages-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  platform-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/platform-smoke.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["rust", "web", "asset-validation", "pages-validation", "platform-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "web", "asset-validation", "pages-validation", "platform-validation"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["asset-validation", "pages-validation", "platform-validation"]' || '[]' }}
