name: physics-contact-bootstrap

on:
  push:
    branches:
      - feature/physics-contact-foundation

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/physics-contact-foundation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Integrate shared physics contact geometry
        run: |
          python3 .github/scripts/integrate_physics_contact.py
          cargo fmt --all
          cargo check -p medieval-core
          cargo test --locked -p medieval-core
          cargo clippy --locked -p medieval-core --all-targets -- -D warnings

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/physics-contact-bootstrap.yml
          git rm .github/scripts/integrate_physics_contact.py
          git add Cargo.toml Cargo.lock crates/medieval-core/Cargo.toml crates/medieval-core/src/tactical.rs docs/physics-engine-integration.md
          git commit -m "Use shared physics contact geometry"
          git push origin HEAD:feature/physics-contact-foundation
