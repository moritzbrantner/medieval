name: persist-controls-e2e

on:
  push:
    branches:
      - feature/tactical-controls-e2e

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Regenerate already-validated production files
        run: |
          python3 .github/scripts/controls-e2e-bootstrap.py
          npm install --package-lock-only --ignore-scripts
      - name: Persist production files
        run: |
          git config user.name "moritzbrantner"
          git config user.email "31051084+moritzbrantner@users.noreply.github.com"
          git add web-battle-wasm/src/lib.rs \
            web/battle-sandbox.js \
            package.json package-lock.json playwright.config.mjs \
            e2e/tactical-controls.spec.mjs \
            docs/BATTLE-ARCHITECTURE.md
          git commit -m "Add end-to-end tactical controls acceptance"
          git push origin HEAD:feature/tactical-controls-e2e
