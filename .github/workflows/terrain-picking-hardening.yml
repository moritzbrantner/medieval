name: terrain-picking-hardening

on:
  push:
    branches:
      - feature/terrain-height-foundation

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/terrain-height-foundation
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Apply and validate terrain picking repair
        run: |
          python3 .github/scripts/harden_terrain_picking.py
          cargo fmt --all
          cargo test --locked -p medieval-renderer
          cargo clippy --locked -p medieval-renderer --all-targets -- -D warnings
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/terrain-picking-hardening.yml
          git rm .github/scripts/harden_terrain_picking.py
          git add crates/medieval-renderer/src/camera.rs
          git commit -m "Harden terrain picking geometry"
          git push origin HEAD:feature/terrain-height-foundation
