[package]
name = "medieval-web-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
medieval-core = { path = "../crates/medieval-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace]
resolver = "2"
