[package]
name = "medieval-web-battle"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
medieval-core = { path = "../crates/medieval-core" }
medieval-renderer = { path = "../crates/medieval-renderer" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
wgpu = "=30.0.1"

[workspace]
resolver = "2"
