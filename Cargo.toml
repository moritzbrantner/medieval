[workspace]
members = ["crates/medieval-core", "crates/medieval-renderer", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "0aa703e3cd6bc3e835d59b59ad15d88abb72c4b3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
