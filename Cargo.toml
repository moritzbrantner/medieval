[workspace]
members = ["crates/medieval-core", "crates/medieval-renderer", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine", rev = "4a695264bc841b24fff3505e7d5b75274f32f5b4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
