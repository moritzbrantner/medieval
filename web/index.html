<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1a16" />
    <title>Medieval</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Campaign prototype</p>
          <h1>Medieval</h1>
        </div>
        <div class="turn-summary" id="turn-summary"></div>
      </header>

      <main class="layout">
        <section class="campaign-map" aria-label="Campaign provinces" id="campaign-map"></section>

        <aside class="sidebar">
          <section>
            <p class="eyebrow">Province</p>
            <div id="province-detail" class="province-detail">Select a province on the map.</div>
          </section>

          <section>
            <p class="eyebrow">Chronicle</p>
            <ol id="chronicle" class="chronicle"></ol>
          </section>

          <div class="actions">
            <button id="new-campaign" class="secondary" type="button">New campaign</button>
            <button id="end-turn" type="button">End turn</button>
          </div>
        </aside>
      </main>
    </div>

    <div id="error" class="error" hidden></div>
    <script src="main.js"></script>
  </body>
</html>
